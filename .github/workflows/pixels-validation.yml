name: Pixels navigation validation
on:
  push:
    branches: [codex/pixels-navigation-20261109]
    paths: [".maintenance/**", ".github/workflows/pixels-validation.yml"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pixels-navigation-20261109
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and browser test dependencies
        run: |
          python -m pip install Pillow==11.3.0 fonttools==4.59.0 brotli==1.1.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Prepare optimized site
        if: ${{ hashFiles('.maintenance/production.txt') == '' }}
        run: python .maintenance/prepare.py
      - name: Test desktop, mobile and catalog interactions
        run: |
          if [ -f .maintenance/production.txt ]; then
            python .maintenance/test.py --production
          else
            python .maintenance/test.py
          fi
      - name: Save reviewable results on the work branch
        if: always()
        run: |
          git config user.name "Pixels site validation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' assets
          if [ -f _headers ]; then git add -- _headers; fi
          if [ -d .maintenance/results ]; then git add -- .maintenance/results; fi
          if ! git diff --cached --quiet; then
            git commit -m "Prepare optimized pages and record browser validation"
            git push origin HEAD:codex/pixels-navigation-20261109
          fi
